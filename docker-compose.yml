services:
  flucito:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flucito
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/datos:/app/backend/datos
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: flucito-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      flucito:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      flucito:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
