<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flucito - Asistente Interflu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-chat">
        <h1>Flucito</h1>
        <p class="subtitulo">Asistente virtual de Interflu (versión de prueba...)</p>
        <p id="estado-backend" class="estado-backend">Conectando con Flucito...</p>

        <div id="mensajes" class="mensajes"></div>

        <div class="acciones-xml">
            <input
                class="visualmente-oculto"
                type="file"
                id="entrada-xml"
                accept=".xml,.pdf,.txt,application/xml,text/xml,application/pdf,text/plain"
                multiple
            >
            <label class="boton-xml" for="entrada-xml" title="Seleccionar XML, PDF o TXT">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
                </svg>
                <span>Adjuntar documentos</span>
            </label>
            <span id="estado-xml" class="estado-xml" role="status">Sin archivos seleccionados</span>
            <button type="button" id="boton-subir-drive" disabled>Guardar en Drive</button>
            <button type="button" id="boton-generar-excel" disabled>Preparar reporte CFDI</button>
        </div>

        <form id="formulario-chat">
            <input
                type="text"
                id="entrada-mensaje"
                placeholder="Escribe tu mensaje..."
                autocomplete="off"
                required
            >
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
